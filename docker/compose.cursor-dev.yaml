# SAM2 trainer cursor-dev: sam2-trainer:dev, repo at /workspace, NAS at /storage4 (path B CIFS).
#
# Copy docker/example.cursor-dev.run.env to docker/.env (or hardlink D:\Docker\Run\sam2-dev\.env)
# so ${NORNIR_NET_MOUNTS_DIR_HOST} etc. substitute. That shared file holds only what TEM and SEM have
# in common. The rest is per modality and comes from a second env file, TEM.env or SEM.env
# (templates: docker/example.TEM.env, docker/example.SEM.env): SAM2_MODALITY, SAM2_LOCAL_DATA_HOST,
# SAM2_OUTPUT_HOST and SAM2_CHECKPOINT_ROOT have no defaults here, so a launch without one fails.
# Pass both: --env-file docker/.env --env-file <D:\Docker\Run\sam2-dev\TEM.env or SEM.env>.
# docker/run-cursor-dev.ps1 -Modality TEM|SEM and docker/docker-build.ps1 -Modality do this for you.
#
# Path B (required for training data): also pass
#   -f $NORNIR_DOCKER_USER_ROOT/Run/sam2-dev/compose.net-mounts.override.yaml
# (template: docker/example.compose.net-mounts.override.yaml). That override reuses
# Nornir's net-mounts TSV and .cred dirs; do not copy secrets into this repo.
#
# From repository root:
#   docker compose -f docker/compose.cursor-dev.yaml build cursor-dev
#   docker/run-cursor-dev.ps1 -Modality TEM   (or SEM)

name: sam2-trainer

x-gallery: &gallery
  build:
    context: ..
    dockerfile: annotation-gallery/Dockerfile
  image: nornir-annotation-gallery:latest
  restart: unless-stopped
  user: "${SAM2_DATA_UID:-1000}:${SAM2_DATA_GID:-1000}"

x-gallery-env: &gallery-env
  GALLERY_HOST: "0.0.0.0"
  GALLERY_HTTP_PORT: "80"
  GALLERY_VOLUME_DIR: ${SAM2_DATA_ROOT:-/data-local/current}
  # oidc: visitors must sign in with Identity Server; Read on the annotation database to view, Write to review.
  GALLERY_IDENTITY_MODE: "${GALLERY_IDENTITY_MODE:-oidc}"
  GALLERY_REQUIRE_LOGIN: "${GALLERY_REQUIRE_LOGIN:-1}"
  GALLERY_STUB_ROLE: "${GALLERY_STUB_ROLE:-review}"
  GALLERY_STUB_GRANTS: "${GALLERY_STUB_GRANTS:-}"
  GALLERY_SESSION_SECRET: "${GALLERY_SESSION_SECRET:?set GALLERY_SESSION_SECRET (a long random string) in the shared .env}"
  GALLERY_VIKING_URL: "${GALLERY_VIKING_URL:-viking://open?volumeName={volume}&location={id}}"
  GALLERY_ODATA_TEMPLATE: "${GALLERY_ODATA_TEMPLATE:-https://websvc.codepharm.net/{volume}/OData}"
  NORNIR_BUILDMANAGER_DIR: /opt/nornir-buildmanager
  GALLERY_OIDC_AUTHORITY: "${GALLERY_OIDC_AUTHORITY:-https://identity.codepharm.net:5001}"
  GALLERY_IDENTITY_API: "${GALLERY_IDENTITY_API:-https://identity.codepharm.net:6001}"
  GALLERY_READ_PERMISSION: "${GALLERY_READ_PERMISSION:-Read}"
  GALLERY_REVIEW_PERMISSION: "${GALLERY_REVIEW_PERMISSION:-Annotate}"
  # The converter (/converter/) and gold review (/gold/) pages. Each is off when its root is empty. The roots are under the
  # mirror, so TEM and SEM keep their own. The converter needs a segmentation server and a VikingXML (<volume> is replaced
  # by the volume name; RC1's VikingXML is in an older format the converter cannot read yet).
  GALLERY_CONVERTER_ROOT: "${GALLERY_CONVERTER_ROOT-/data-local/converter}"
  GALLERY_GOLD_ROOT: "${GALLERY_GOLD_ROOT-/data-local/gold}"
  GALLERY_SEGMENTATION_TARGET: "${GALLERY_SEGMENTATION_TARGET:-host.docker.internal:40448}"
  GALLERY_SEGMENTATION_TLS_NAME: "${GALLERY_SEGMENTATION_TLS_NAME:-segmentation.codepharm.net}"
  GALLERY_CONVERTER_VIKINGXML: "${GALLERY_CONVERTER_VIKINGXML:-http://rogue1.codepharm.net/<volume>/SliceToVolume.VikingXML}"
  GALLERY_CONVERTER_VIKINGXML_RC1: "${GALLERY_CONVERTER_VIKINGXML_RC1:-http://rogue1.codepharm.net/RABBIT/rogue1.vikingxml}"
  GALLERY_CONVERTER_TILE_CACHE: "${GALLERY_CONVERTER_TILE_CACHE:-/data-local/converter/tile-cache}"

x-nornir-buildmanager: &nornir-buildmanager
  type: bind
  source: ${NORNIR_BUILDMANAGER_HOST:-../../nornir/nornir-buildmanager}
  target: /opt/nornir-buildmanager
  read_only: true


services:
  cursor-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SAM2_GIT_SHA: ${SAM2_GIT_SHA:-2b90b9f5ceec907a1c18123530e92e794ad901a4}
    image: sam2-trainer:dev
    working_dir: /workspace
    stdin_open: true
    tty: true
    gpus: all
    shm_size: "64gb"
    # Host 8060 -> TensorBoard --port 6006 inside the container.
    ports:
      - "8060:6006"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - /bin/bash
      - /usr/local/bin/cursor-dev-entry.sh
      - bash
    environment:
      # TEM or SEM, from the modality env file; the trainer tools and docker-build.ps1 read it.
      SAM2_MODALITY: ${SAM2_MODALITY:?set SAM2_MODALITY via TEM.env or SEM.env (pass --env-file <Modality>.env)}
      SAM2_DATA_ROOT: ${SAM2_DATA_ROOT:-/data-local/current}
      SAM2_OUTPUT_ROOT: /outputs
      # Run checkpoints + TB events on CIFS (not the Windows /outputs bind).
      SAM2_CHECKPOINT_ROOT: ${SAM2_CHECKPOINT_ROOT:?set SAM2_CHECKPOINT_ROOT via TEM.env or SEM.env}
      SAM2_CHECKPOINT_URL: ${SAM2_CHECKPOINT_URL:-https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_large.pt}
      # In-container TensorBoard port (compose publishes host 8060:6006).
      SAM2_TENSORBOARD_PORT: "6006"
      SAM2_TENSORBOARD_HOST_PORT: "8060"
      # Publish training progress to the shared dashboard broker (nornir-docker/compose.dashboard.yaml).
      # host.docker.internal reaches the host-published Mosquitto port from the container.
      NORNIR_MQTT_HOST: ${NORNIR_MQTT_HOST:-host.docker.internal}
      NORNIR_MQTT_PORT: ${NORNIR_MQTT_PORT:-1883}
      NORNIR_MQTT_ENABLE: ${NORNIR_MQTT_ENABLE:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${SAM2_WORKSPACE_HOST:-..}
        target: /workspace
      - type: bind
        source: ${SAM2_LOCAL_DATA_HOST:?set SAM2_LOCAL_DATA_HOST via TEM.env or SEM.env}
        target: /data-local
      - type: bind
        source: ${SAM2_OUTPUT_HOST:?set SAM2_OUTPUT_HOST via TEM.env or SEM.env}
        target: /outputs
      - type: bind
        source: ./cursor-dev-entry.sh
        target: /usr/local/bin/cursor-dev-entry.sh
        read_only: true
      - type: bind
        source: ./mount-network-shares.sh
        target: /usr/local/bin/mount-network-shares.sh
        read_only: true
      - type: bind
        source: ./drop-sys-admin-after-mounts.sh
        target: /usr/local/bin/drop-sys-admin-after-mounts.sh
        read_only: true
      # Published section-correction sets (<DB>/<stos group>/manifest.json + <z>.vfield.npz), read-only: the trainer
      # uses them to place carried-forward adjacent polygons (data.corrections_root: /corrections). This is the folder
      # the correction service serves from; override the host path with SAM2_CORRECTIONS_HOST.
      - type: bind
        source: ${SAM2_CORRECTIONS_HOST:-\\wsl.localhost\Ubuntu\srv\viking\section-correction\corrections}
        target: /corrections
        read_only: true
      # nornir_shared MQTT helpers, read-only. Entry script warns and continues if import fails.
      - type: bind
        source: ${NORNIR_SHARED_HOST:-../../nornir/nornir-shared}
        target: /opt/nornir-shared
        read_only: true

  # Two galleries from one image: TEM and SEM mirrors side by side, independent of which modality the trainer runs.
  # Both listen on plain HTTP on the compose network only; gallery-router terminates TLS for
  # tem. / sem.gallery.codepharm.net. Published HTTP ports (debugging): TEM 8081, SEM 8082.
  annotation-gallery-tem:
    <<: *gallery
    environment:
      <<: *gallery-env
      SAM2_MODALITY: TEM
      GALLERY_PUBLIC_HTTPS_ORIGIN: "https://tem.gallery.codepharm.net"
      GALLERY_OIDC_REDIRECT_URI: "https://tem.gallery.codepharm.net/callback"
      GALLERY_OIDC_CLIENT_ID: "${GALLERY_TEM_OIDC_CLIENT_ID:-}"
      GALLERY_OIDC_CLIENT_SECRET: "${GALLERY_TEM_OIDC_CLIENT_SECRET:-}"
    ports:
      - "${GALLERY_TEM_HTTP_PUBLISH:-8081:80}"
    volumes:
      - type: bind
        source: ${SAM2_LOCAL_DATA_HOST_TEM:?set SAM2_LOCAL_DATA_HOST_TEM in the shared .env (the TEM mirror)}
        target: /data-local
      - *nornir-buildmanager

  annotation-gallery-sem:
    <<: *gallery
    environment:
      <<: *gallery-env
      SAM2_MODALITY: SEM
      GALLERY_PUBLIC_HTTPS_ORIGIN: "https://sem.gallery.codepharm.net"
      GALLERY_OIDC_REDIRECT_URI: "https://sem.gallery.codepharm.net/callback"
      GALLERY_OIDC_CLIENT_ID: "${GALLERY_SEM_OIDC_CLIENT_ID:-}"
      GALLERY_OIDC_CLIENT_SECRET: "${GALLERY_SEM_OIDC_CLIENT_SECRET:-}"
    ports:
      - "${GALLERY_SEM_HTTP_PUBLISH:-8082:80}"
    volumes:
      - type: bind
        source: ${SAM2_LOCAL_DATA_HOST_SEM:?set SAM2_LOCAL_DATA_HOST_SEM in the shared .env (the SEM mirror)}
        target: /data-local
      - *nornir-buildmanager

  # TLS front door and the gallery.codepharm.net redirect. Config: gallery-router/gallery.conf. The active
  # modality file is written by run-cursor-dev.ps1 / docker-build.ps1. Host 8080 -> :80 (plain HTTP, redirects),
  # host 8442 -> :443 (the reverse proxy's stream passes SNI for all three names here).
  gallery-router:
    container_name: gallery-router
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - annotation-gallery-tem
      - annotation-gallery-sem
    ports:
      - "${GALLERY_ROUTER_HTTP_PUBLISH:-8080:80}"
      - "${GALLERY_ROUTER_HTTPS_PUBLISH:-8442:443}"
    volumes:
      - type: bind
        source: ./gallery-router/gallery.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${SAM2_GALLERY_ROUTER_DIR:-D:/Docker/mounted-configs/sam2-trainer/gallery-router}
        target: /etc/nginx/active
        read_only: true
      - type: volume
        source: gallery-letsencrypt
        target: /etc/letsencrypt
        read_only: true

  # Shared Servers/certbot image (VikingServers repo) with the gallery's own
  # lineage and volume for gallery.codepharm.net. DNS-01 via Cloudflare, so no
  # inbound port is needed for enrollment. After a new certificate it restarts
  # annotation-gallery, which binds HTTPS on startup.
  # Started only with: --profile letsencrypt
  annotation-gallery-certbot-renewer:
    profiles: ["letsencrypt"]
    container_name: annotation-gallery-certbot-renewer
    build:
      context: ${CERTBOT_BUILD_CONTEXT:-../../VikingSlackUsersAI/VikingServers/Servers/certbot}
      dockerfile: Dockerfile
    image: annotation-gallery-certbot-renewer:latest
    restart: unless-stopped
    environment:
      LETSENCRYPT_PRIMARY_DOMAIN: "${LETSENCRYPT_PRIMARY_DOMAIN:-gallery.codepharm.net}"
      # One certificate for all three names; gallery-router terminates TLS. An existing lineage is not widened
      # by this setting alone: it needs the one-time certbot --expand (README, "Gallery hostnames").
      LETSENCRYPT_ADDITIONAL_DOMAINS: "${LETSENCRYPT_ADDITIONAL_DOMAINS:-tem.gallery.codepharm.net,sem.gallery.codepharm.net}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL:-}"
      CERTBOT_STAGING: "${CERTBOT_STAGING:-false}"
      CERTBOT_AUTH_METHOD: "${CERTBOT_AUTH_METHOD:-dns-cloudflare}"
      CERTBOT_RESTART_CONTAINER: gallery-router
      CF_DNS_API_CREDENTIALS_FILE: /run/secrets/cloudflare.ini
      CF_DNS_PROPAGATION_SECONDS: "${CF_DNS_PROPAGATION_SECONDS:-60}"
    volumes:
      - gallery-letsencrypt:/etc/letsencrypt
      - gallery-certbot-lib:/var/lib/letsencrypt
      - gallery-certbot-logs:/var/log/letsencrypt
      - type: bind
        source: ${CF_DNS_API_CREDENTIALS_HOST_PATH:-D:/Docker/Builds/cloudflare.ini}
        target: /run/secrets/cloudflare.ini
        read_only: true
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-//var/run/docker.sock}
        target: /var/run/docker.sock
    entrypoint: ["bash", "/opt/identity-certbot/renew-loop.sh"]

volumes:
  gallery-letsencrypt:
  gallery-certbot-lib:
  gallery-certbot-logs:
