# Front door for the annotation galleries (one TLS endpoint, one certificate, one restart target).
#   tem.gallery.codepharm.net / sem.gallery.codepharm.net -> that modality's gallery (plain HTTP on the compose network)
#   gallery.codepharm.net                                 -> 302 to whichever modality the trainer container is running
# The certificate is the gallery-letsencrypt volume the certbot renewer fills; the renewer restarts this container.
# The active modality comes from /etc/nginx/active/active.conf (run-cursor-dev.ps1 / docker-build.ps1 write it).

# Self-identified AI crawlers. The gallery refuses them too; this keeps them off the app entirely.
map $http_user_agent $ai_bot {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|Claude-User|Claude-SearchBot|anthropic-ai|CCBot|Google-Extended|GoogleOther|PerplexityBot|Perplexity-User|Bytespider|Amazonbot|Applebot-Extended|cohere-ai|meta-externalagent|FacebookBot|Diffbot|omgili|ImagesiftBot|Timpibot|YouBot|AI2Bot|DuckAssistBot|MistralAI-User) 1;
}

resolver 127.0.0.11 valid=10s ipv6=off;

ssl_certificate     /etc/letsencrypt/live/gallery.codepharm.net/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/gallery.codepharm.net/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex, noai, noimageai" always;

server {
    listen 80 default_server;
    server_name _;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { return 301 https://$host$request_uri; }
}

# Any other name: no certificate answer.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name gallery.codepharm.net;
    if ($ai_bot) { return 403; }
    include /etc/nginx/active/active.conf;   # set $gallery_target tem|sem;
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { return 302 https://$gallery_target.gallery.codepharm.net$request_uri; }
}

server {
    listen 443 ssl;
    server_name tem.gallery.codepharm.net;
    if ($ai_bot) { return 403; }
    client_max_body_size 64m;
    location / {
        set $upstream http://annotation-gallery-tem:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }
}

server {
    listen 443 ssl;
    server_name sem.gallery.codepharm.net;
    if ($ai_bot) { return 403; }
    client_max_body_size 64m;
    location / {
        set $upstream http://annotation-gallery-sem:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }
}
