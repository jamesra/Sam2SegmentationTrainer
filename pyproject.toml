[project]
name = "sam2-segmentation-trainer"
version = "0.1.0"
description = "Fine-tune Meta SAM2 on TEM/SEM electron microscopy data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "albumentations",
    "hydra-core",
    "omegaconf",
    "opencv-python-headless",
    "pillow",
    "pycocotools",
    "scikit-image",
    "paho-mqtt>=2.1.0",
    "scipy",
    "tensorboard",
    "tqdm",
]

[project.scripts]
sam2-em-validate = "sam2_segmentation_trainer.validate:main"
sam2-em-train = "sam2_segmentation_trainer.train:main"
sam2-em-eval = "sam2_segmentation_trainer.evaluate:main"
sam2-em-infer = "sam2_segmentation_trainer.infer:main"
sam2-em-export-serve = "sam2_segmentation_trainer.export_serve:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sam2_segmentation_trainer*"]

[tool.setuptools.package-data]
sam2_segmentation_trainer = ["config/*.yaml"]
