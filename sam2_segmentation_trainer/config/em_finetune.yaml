# @package _global_

training:
  # auto + resume: continue the run with the newest last.pt.
  # auto + -refresh: start sam2_em_vN+1 from pretrained weights.
  run_name: auto
  run_name_prefix: sam2_em
  output_dir: null
  # Large checkpoints (last.pt / best_model) — default /storage4/Sam2Trainer via env.
  checkpoint_dir: null
  num_epochs: 15
  batch_size: 4
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  seed: 42
  mixed_precision: true
  gradient_accumulation_steps: 4
  gradient_clip: 1.0
  log_every_n_steps: 50
  # torch.profiler traces for the TensorBoard PYTORCH_PROFILER tab.
  # One short window per process, then the profiler stays idle.
  # The trace appears after skip_first + wait + warmup + active batches.
  # repeat is the number of windows per process; 0 turns the profiler off.
  profiler:
    enabled: true
    skip_first: 5
    wait: 1
    warmup: 1
    active: 3
    repeat: 1
    record_shapes: true
    profile_memory: true
    with_stack: false
    with_modules: true
  val_every_n_epochs: 1
  # TensorBoard Images: a few val samples per volume present in the loader.
  # Strip is input | ground truth | prediction (red = extra, blue = missed).
  # First validation of a process logs, then again after this many train steps.
  # 0 disables.
  val_images_every_n_steps: 2500
  val_images_per_volume: 3
  save_every_n_epochs: 3
  save_every_n_steps: 200
  resume: true
  early_stopping_patience: 5
  # 0: any val IoU increase resets patience. Pass training.early_stopping_min_delta=0.0005 to require a larger gain.
  early_stopping_min_delta: 0
  # MQTT warn when a step is much slower / higher-loss than the recent median.
  warn_anomaly_warmup: 30
  warn_anomaly_window: 100
  warn_slow_factor: 2.5
  warn_slow_seconds: 3.0
  warn_high_loss_factor: 5.0
  warn_high_loss_absolute: 3.0

optimizer:
  type: AdamW
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

lr_schedule:
  type: cosine_with_warmup
  warmup_epochs: 1
  min_lr: 1.0e-6

differential_lr:
  encoder_lr_factor: 0.1

# Prompt mix for training samples. Probabilities must sum to 1.0 (checked when the config loads).
# A sample whose tile has no circle for its target, or no other annotation, loses those two types and
# their share moves to the rest. Validation always uses a single centroid point so IoU stays comparable.
prompt:
  # false: every training sample is the original single centroid point.
  enabled: true
  prob_points_only: 0.10
  prob_box_only: 0.05
  prob_box_points: 0.05
  prob_circle_mask: 0.45  # design doc said 0.40, which left the table at 95%; the 5% goes to the production prompt
  prob_full_mask: 0.30
  prob_negative_only: 0.05
  # Each box edge is pushed out by uniform(0, box_jitter_frac * edge length). A box is only a hint that the
  # object is most likely inside; nothing penalizes predictions that leave it.
  box_jitter_frac: 0.15
  box_points_max: 3
  # Foreground and background points stay at least this far (pixels) from the mask boundary.
  min_edge_px: 15
  line_frac_min: 0.40
  line_frac_max: 0.90

# Other annotations in the same tile are negative context: a -1 area of the dense mask prompt and, by chance,
# background points.
negative:
  bg_point_prob_circle: 0.25
  bg_point_prob_polygon: 0.15
  # Decoded neighbor masks kept per DataLoader worker (each worker has its own cache).
  cache_size: 64
  # Also train the negative-only prompt on circle annotations that have no mask (the disc is the target).
  allow_circle_targets: false
  # Cap on those samples as a fraction of the mask-bearing examples.
  circle_target_fraction: 0.05

loss:
  focal_weight: 20.0
  dice_weight: 1.0
  iou_weight: 1.0
  # Hinge penalty for predicting background where a dense mask prompt said foreground (the mask is a seed
  # the engine grows beyond). 0 disables. Ramps up linearly over containment_warmup_epochs.
  mask_contain_weight: 0.5
  containment_warmup_epochs: 2
  # Penalizes predicting background at prompted point locations (BCE toward 1
  # inside a disk of containment_radius pixels around each positive point).
  # 0 disables the term.
  containment_weight: 0.0
  containment_radius: 8.0

data:
  root: null
  volumes: [RC1, RC2, RPC1, RPC2]
  image_size: 1024
  mask_threshold: 0.5
  train_split: 0.9
  # zslab: validation is slab_count contiguous runs of sections spaced evenly through each volume, together about
  # (1 - train_split) of its examples, with guard_sections sections on each side of every slab used by neither
  # side. Adjacent sections and overlapping crop windows then never cross the split.
  # location: the original random 90/10 over location keys. An existing run keeps the split in its split.json;
  # changing the mode needs -refresh.
  split_mode: zslab
  zslab:
    slab_count: 5
    guard_sections: 1
  split_name: zslab_v1
  # location mode only. false: 90/10 inside each volume, using every usable sample.
  # true: also cap every volume to the smallest volume's count.
  even_per_volume: false

model:
  checkpoint: null
  config: configs/sam2.1/sam2.1_hiera_l.yaml
  freeze_mode: none
  # Train the prompt encoder's mask_downscaling network (about 50K parameters) so it learns the -1/0/+1
  # mask prompt. Only applies with prompt.enabled. Changing it needs -refresh, not resume.
  unfreeze_mask_cnn: true
  activation_checkpointing: true

eval:
  grid_every: 10
  max_grids: 40

hydra:
  job:
    chdir: false
  run:
    dir: .
