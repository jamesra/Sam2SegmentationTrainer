# @package _global_

training:
  # Pinned for the v5 run (4 prompt variants, three circle peers). With auto, resume would continue the newest
  # last.pt, which is sam2_em_v4_centred (a 3-variant run). Resume also refuses any run whose saved config.yaml has
  # another prompt layout (variants_per_sample, the prob_* keys and values, the circle peer sections).
  # auto + resume: continue the run with the newest last.pt.
  # auto + -refresh: start sam2_em_vN+1 from pretrained weights.
  run_name: sam2_em_v5
  run_name_prefix: sam2_em
  output_dir: null
  # Large checkpoints (last.pt / best_model) — default /storage4/Sam2Trainer via env.
  checkpoint_dir: null
  num_epochs: 15
  # Batch 2 with 8 accumulation steps (effective batch 16), activation checkpointing off. Measured Oct 27 2026 on the
  # RTX 4500 Ada (23 GB) beside the `latest` segmentation server (2.4 GB, 512 MiB GPU cache cap), 4 prompt variants,
  # sam2-em-train -benchmark, 150 timed batches, expandable_segments on:
  #   batch 2 x 8, no checkpointing    0.305 s per sample, 15.6 GiB reserved, card peak 22.2 GB: under 1 GB free.
  #                                    With Viking open as well it spilled about 1 GB into system memory and crawled,
  #                                    so keep other GPU use light while training, or turn checkpointing on:
  #   batch 2 x 8, 0.25 checkpointed   0.380 s per sample, 12.9 GiB reserved, card peak 20.3 GB (2.7 GB free)
  #   batch 1 x 16, no checkpointing   0.428 s per sample,  9.6 GiB reserved
  #   batch 4 x 4, all checkpointed    0.445 s per sample,  8.5 GiB reserved
  # (Oct 18's batch 1 choice was measured with the server holding about 8 GB under a 14 GiB cap.)
  # log_every_n_steps, val_images_every_n_steps and the profiler schedule count batches (micro-batches);
  # save_every_n_steps and the LR warmup count optimizer steps (batch_size x accumulation samples).
  batch_size: 2
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  seed: 42
  mixed_precision: true
  # cuDNN autotuner for the fixed 1024 tile. Off: benchmarked on an RTX 4500 Ada (22.5 GB), batch 4, 1024 px, it
  # gave no speed-up (3 variants: 1.297 s/step off vs 1.32 s on; 1 to 4 variants: off was 2-3% faster every time)
  # and it picked convolution algorithms with a huge workspace for some batch shapes (peak 21.0 GB at 3 prompt
  # variants with it on, against 7.0 GB off; 11.9 GB at 1, 2 and 4 variants on, 6.7-7.5 GB off).
  cudnn_benchmark: false
  gradient_accumulation_steps: 8
  gradient_clip: 1.0
  log_every_n_steps: 50
  # torch.profiler traces for the TensorBoard PYTORCH_PROFILER tab.
  # One short window per process, then the profiler stays idle.
  # The trace appears after skip_first + wait + warmup + active batches.
  # repeat is the number of windows per process; 0 turns the profiler off.
  profiler:
    enabled: true
    skip_first: 5
    wait: 1
    warmup: 1
    active: 3
    repeat: 1
    record_shapes: true
    profile_memory: true
    with_stack: false
    with_modules: true
  val_every_n_epochs: 1
  # TensorBoard Images: a few val samples per volume present in the loader.
  # Strip is input | ground truth | prediction (red = extra, blue = missed).
  # First validation of a process logs, then again after this many train steps.
  # 0 disables.
  val_images_every_n_steps: 2500
  val_images_per_volume: 3
  save_every_n_epochs: 3
  # After each epoch, start a separate process that writes <run>/serve/serve_epoch<N>.pt (the file the segmentation
  # server loads, with its prompt_encoding record). Training does not wait for it.
  export_serve_each_epoch: true
  save_every_n_steps: 200
  resume: true
  # Epochs without a better checkpoint before training stops. 0 disables early stopping. An epoch is better than the
  # best so far when at least one metric of the primary family (circle_annotator, on the per-epoch subset) is better
  # by at least its noise floor below and none is worse by its floor; changes inside a floor are noise either way.
  # The core-recall target (val.core_recall_target) is reported but is not a gate: the validation masks are traced
  # annotations, not a checked validation set.
  early_stopping_patience: 2
  # Noise floors: the 95th-percentile error of a 10% subset (val.epoch_subset) of validation set v5, measured
  # 2026-10-20 on v5's epoch-0 checkpoint over 200 random subsets (scripts/valset_size_study.py,
  # /outputs/valset_size_v5_e0/size_study.md). The merge rate measured 0.0008; 0.002 leaves room for a model that
  # merges more often. Metrics left out take the defaults in goal_metrics.SELECTION_FLOORS.
  early_stopping_floors:
    core_recall: 0.004
    iou: 0.006
    spill: 0.006
    merge_rate: 0.002
    frag: 0.012
  # MQTT warn when a step is much slower / higher-loss than the recent median.
  warn_anomaly_warmup: 30
  warn_anomaly_window: 100
  warn_slow_factor: 2.5
  warn_slow_seconds: 3.0
  warn_high_loss_factor: 5.0
  warn_high_loss_absolute: 3.0

optimizer:
  type: AdamW
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]

lr_schedule:
  type: cosine_with_warmup
  warmup_epochs: 1
  min_lr: 1.0e-6

differential_lr:
  encoder_lr_factor: 0.1

# Prompt mix for training samples (docs/mask_refinement_plan.md). Probabilities must sum to 1.0 (checked when the
# config loads). Every family is trained against the true polygon; the full ground-truth mask is never a prompt.
# Dense mask prompts are scaled by an edge confidence curve c(d) = 1 - exp(-d / tau_eff), so the traced edge
# is trusted loosely and the interior fully. The server must use the same function and constants
# (annotation_crops/prompt_encoding.py). Validation always uses fixed prompts so scores stay comparable.
prompt:
  # false: every training sample is the original single centroid point.
  enabled: true
  # Diameter of a SEED circle (a polygon's inscribed circle, the plain circle_seed prompt) as a fraction of its true
  # diameter. It does not apply to circle annotations, which only ever serve as negatives (see below).
  # The exporter never scales: it writes true radii (diameter_scale 1.0); the trainer applies this on load, and
  # rescales a file from an older exporter that baked a scale in, so changing it needs no re-export.
  circle_diameter_scale: 0.95
  # Trust in a circle ANNOTATION (circle_annotations.json source "annotated"), as fractions of its TRUE radius:
  # its radii are unreliable (about 2x in the radius-bug cases), so it is used only as a negative. The negative
  # is fed at full strength (-seed_logit) inside full_frac, tapers to 0 with a half cosine, and the circle claims
  # nothing beyond zero_frac. The core used for leak and the metrics, and for its background points, is
  # rho <= full_frac. Needs 0 <= full_frac < zero_frac. Recorded with the model (prompt_encoding.json).
  circle_annotation_trust:
    full_frac: 0.5    # full -SEED_LOGIT inside this fraction of the TRUE radius
    zero_frac: 0.95   # taper reaches 0 here; the circle claims nothing beyond
  # Annotator-like circles (docs/circle_annotator_spec.md): the disc of the circle_annotator prompt type (its share is
  # prob_circle_annotator below) and of the circle_annotator validation family. Not part of the prompt encoding: it
  # changes which circles are drawn, not how a prompt is encoded.
  circle_seed_jitter:
    depth_range: [0.3, 1.0]   # centre depth as a fraction of the target's maximum depth (1 = deepest point)
    scale_range: [0.45, 1.0]  # radius as a fraction of the maximum depth, before the fit cap
    fit_grow_px: 10       # the radius may exceed the centre's own depth by this much
    min_radius_px: 6      # a smaller circle falls back to the plain circle_seed
  # Pull-through circles (docs/circle_annotator_spec.md, "Pull-through circles"): the disc of the circle_pull_through
  # prompt type (its share is prob_circle_pull_through below), an annotator circle drawn across the cell edge, mostly
  # inside. The model must ignore the part outside and expand to the full cell. No validation family.
  circle_pull_through:
    overlap_min: 0.60     # at least this fraction of the disc lies inside the target
    outside_min: 0.05     # at least this fraction lies outside it (the disc really crosses the edge)
    radius_range: [0.4, 0.9]  # radius as a fraction of the target's maximum depth
    min_radius_px: 6      # floor on the radius
    max_tries: 20         # radius-and-centre draws before giving up (the variant falls back to the plain circle_seed)
  # The adjacent-section polygon seed (adjacent_poly_seed; its share is prob_adjacent_poly_seed below). projected: the
  # linked neighbour outline is carried through the volume's registration (neighbour stos -> volume, residual
  # correction, inverse target stos; data.registration_root / data.corrections_root) to where Viking puts a
  # carried-forward polygon, eroded by U(erode_px) and used there, not scaled to fit. Like the pull-through circle it
  # counts only when at least overlap_min of its area in the tile lies on the target mask; otherwise that variant is
  # drawn again from the other families (train/prompt_fallback/adjacent_poly_seed; train/adjacent_poly/pass_rate
  # and train/adjacent_poly/share show the rule and the realised share). Through the dataset on set v3, with 0-10 px
  # erosion, 90% (RC2, RPC1) and 94% (RPC2) of the drawn outlines pass (docs/mask_refinement_plan.md, 3.1). A volume without the
  # registration data falls back to centroid with a warning: the shape is moved onto the target's centroid and
  # scaled to fit inside the cell (adjacent_fit_* below). raw: as written (a test hook).
  adjacent_poly:
    placement: projected
    overlap_min: 0.60     # at least this fraction of the eroded outline's area in the tile lies on the target
    erode_px: [0, 10]     # the carried-forward outline is eroded by U(erode_px) px before the test (capped at 0.6 of its depth)
  # Prompt variants decoded per encoded sample. All of them, the first included, are drawn from the prob_* mix below
  # WITHOUT replacement (no family is forced on a sample, and a family appears at most once per sample), renormalised
  # over the families the sample can still use. So a family's realised share of the variants differs from its prob_*:
  # rare families are over-represented and common ones under-represented (see train/prompt_mix/* and
  # train/prompt_count/* in TensorBoard, which count the family built after any fallback, and
  # train/prompt_fallback/*). A fully masked tile can draw only points, circle_seed and circle_annotator (no edge
  # for a pull-through circle to cross), so it has at most three variants. The image encoder
  # runs once per sample; each variant is one decoder pass.
  variants_per_sample: 4
  # tau of the prompt confidence curve in pixels. Traces are about 9 px (20 nm) from the membrane on average, so
  # 8 px puts 95% confidence about 24 px inside the traced line.
  edge_tau_px: 8.0
  # Thin-process cap: tau_eff = min(edge_tau_px, edge_tau_depth_frac * D), D the mask's maximum depth, computed per
  # mask (the target, each seed, each neighbor), in the prompt and in the loss weight. A process 20 px wide has
  # D about 10 and gets tau_eff 2.5, so it is not all edge. 0 turns the cap off.
  edge_tau_depth_frac: 0.25
  # Logit of a trusted seed pixel (M_seed) and of a mask to correct (M_corr, lower: it is only a suggestion).
  seed_logit: 10.0
  correction_logit: 3.0
  prob_points_only: 0.10
  prob_box_only: 0.05
  prob_box_points: 0.05
  # Seeds (trusted; the containment loss applies to their core, inside the target only). Three peer circle prompts,
  # each a disc plus its centre point:
  prob_circle_seed: 0.10          # plain: the tile's circle or the inscribed circle x circle_diameter_scale
  prob_circle_annotator: 0.20     # annotator-like: off-centre and smaller (circle_seed_jitter)
  prob_circle_pull_through: 0.05  # drawn across the cell edge, mostly inside (circle_pull_through); not clipped
  # A circle that cannot be drawn (too small a cell) falls back to the plain circle_seed.
  # A linked polygon from the adjacent section (the Viking workflow), read from the exporter's <volume>/shapes.jsonl
  # (one linked outline 1-2 sections away, in its own section's mosaic pixels) and placed as adjacent_poly says. For
  # a sample without one (no link, no file, no outline reaching the tile, or a fully masked tile) its share moves to
  # the three circle peers in proportion to their shares.
  prob_adjacent_poly_seed: 0.15
  prob_subset_seed: 0.15    # a part of the true mask: eroded 10-40 px, then optionally cut straight or along the cell
  # Masks to correct (suggestions that may be wrong; no containment loss):
  prob_correction: 0.10     # grown, eroded, scaled, warped, simplified or merged with a neighbor
  # A good human trace: outline wobble of 5-12 px on average plus 1-3 local bulges or dents of 15-30 px. The model
  # must leave it at least as good (val "do no harm").
  prob_near_correct: 0.05
  # The centroid fallback of adjacent_poly only: the shape is scaled to fit inside the cell.
  adjacent_fit_inside: 0.98          # share of the scaled seed that must lie inside the target grown by adjacent_fit_grow_px
  adjacent_fit_grow_px: 10           # the annotator fits the seed to the visible membrane, up to this far outside the trace
  adjacent_scale_range: [0.7, 1.0]   # factor applied to the fitted scale
  erode_px: [10, 40]                 # shrink range of a subset seed (applied before any cut)
  dilate_px: [5, 50]                 # grow range of a mask to correct
  shrink_px: [5, 50]                 # erode range of a mask to correct (the mirror of dilate_px; capped at half the mask depth)
  scale_range: [0.8, 1.25]           # wheel-style scale of a mask to correct
  correction_wobble_px: [10, 20]     # mean outline displacement of a mask to correct's wobble (local excursions up to 50 px)
  near_correct_wobble_px: [5, 12]    # MEAN outline displacement of a near-correct mask
  near_correct_excursion_px: [15, 30]  # amplitude of each of its 1-3 local bulges or dents (30-150 px of outline each)
  corrupt_max_shift_px: 30         # grow or shrink by 1..this many pixels after a simplified outline
  corrupt_polygon_tolerance: 0.04  # simplified outline: tolerance as a fraction of sqrt(area)
  # Each box edge is pushed out by uniform(0, box_jitter_frac * edge length). A box is only a hint that the
  # object is most likely inside; nothing penalizes predictions that leave it.
  box_jitter_frac: 0.15
  box_points_max: 3
  # Foreground and background points stay at least this far (pixels) from the mask boundary.
  min_edge_px: 15
  line_frac_min: 0.40
  line_frac_max: 0.90

# Other annotations in the same tile are negative context: a negative area of the dense mask prompt (scaled by
# each neighbor's own edge confidence) and, by chance, background points.
negative:
  bg_point_prob_circle: 0.25
  bg_point_prob_polygon: 0.15
  # Decoded neighbor masks kept per DataLoader worker (each worker has its own cache).
  cache_size: 64
  # Leave out a neighbor's circle negative when it reaches into the target mask (it would say background
  # about pixels the loss calls foreground). Choosing by the true mask leaks a little of its extent into the
  # prompt. Measured with sam2-em-validate --circle-overlap 2000 (Oct 14 2026): a circle reached into the target in
  # 40 of 1637 examples that have circle negatives (2.4%; RC1 1.6%, RC2 0%, RPC1 3.5%, RPC2 3.0%), above the 1%
  # threshold, so it is on.
  drop_overlapping_circles: true
  # Training variants (every one of them; validation never) sometimes lose their negative context,
  # so the model does not depend on neighbors always being sent: context_dropout is the chance a variant carries
  # none (no negative area, no background points); region_dropout is then the chance each remaining neighbor is
  # dropped on its own. Drawn from the variant's own rng. The ground truth is unchanged, so the leak weight and the
  # containment weight still see every neighbor; validation never drops anything.
  context_dropout: 0.2
  region_dropout: 0.2

loss:
  focal_weight: 20.0
  dice_weight: 1.0
  iou_weight: 1.0   # the IoU head is trained with absolute (L1) error, as in SAM 2; there is no other form
  # Hinge penalty for predicting background where a seed said foreground (the seed is a core the engine grows
  # beyond), weighted by the seed's edge confidence and counted only where the seed overlaps the ground-truth target
  # (an annotator-like circle may reach past it; the prompt itself is not clipped). Never applied to masks to
  # correct. 0 disables. Ramps up linearly over containment_warmup_epochs.
  mask_contain_weight: 0.5
  containment_warmup_epochs: 2
  # Penalizes predicting background at prompted point locations (BCE toward 1
  # inside a disk of containment_radius pixels around each positive point).
  # 0 disables the term.
  containment_weight: 0.0
  containment_radius: 8.0
  # Edge-tolerant loss: labels stay hard 0/1 but each pixel is weighted w(d) = max(edge_weight_min,
  # 1 - exp(-d / tau_eff)) by its distance d to the ground-truth edge (both sides), in the focal, dice and
  # IoU-head terms, so hand-tremor disagreement at the traced line is nearly free. tau_eff is capped per mask by
  # prompt.edge_tau_depth_frac. 0 disables it. The diagnostic tolerant IoU ignores pixels with w < 0.5 whatever
  # this is (8 px when 0).
  edge_tau_px: 8.0
  edge_weight_min: 0.05
  # Leak penalty: the focal and dice weight of pixels at least val.core_band_px inside another annotation and
  # outside the target is multiplied by this. A merge breaks connectivity, so it costs more than an equal area of
  # edge error. Applies to every sample, neighbor-merge samples included. 1 turns it off.
  leak_weight: 3.0

data:
  root: null
  volumes: [RC1, RC2, RPC1, RPC2]
  image_size: 1024
  mask_threshold: 0.5
  train_split: 0.9
  # Fail at startup when circle-mask prompts are on but a volume has no circle_annotations.json (the prompt mix
  # would silently shift to the other types). false: warn only.
  require_circle_file: true
  # Fully masked tiles: where the target covers at least full_tile_threshold of the tile (null disables), training
  # keeps a deterministic full_tile_keep_fraction of them and gives them only point or circle-mask prompts.
  # Validation scores them apart (val/iou_fulltile) and leaves them out of val/iou.
  full_tile_threshold: 0.99
  full_tile_keep_fraction: 0.25
  # The gallery's approved masks. null: read {data_root}/{volume}/approved.json for every volume in data.volumes
  # (flat or AnnotationCrops layout). Or a file, a directory, or a list of those. Entries are
  # {"location_id", "image_key"}; an empty image_key approves every window of that location in that volume
  # (location ids are only unique within a volume). Counts are logged per volume at start-up and a total of 0 warns.
  # Approved masks are reported as their own validation row, always join the validation subset, and get
  # approved_weight in training.
  approved_path: null
  # Training weight of Approved masks (2.0 to try).
  approved_weight: 1.0
  # Elastic warp of training images (a fifth of samples, at most about 2 px of movement). Off: the training set is
  # large. Turn on with data.elastic_warp=true on the command line. Validation never augments.
  elastic_warp: false
  # Validation that stays the same across runs (docs/validation_sets.md; files under {SAM2_CHECKPOINT_ROOT}/valsets,
  # made with sam2-em-valsets). frozen_split: a name (val_v1) or a path. A NEW run starts from that split instead of
  # building one, and locations added since it was frozen are placed by their section, so every run that names it
  # validates on the same sections. A run that already has its own split.json keeps it. null builds a split as below.
  frozen_split: null
  # gold_set: a name (gold_v1) or a path. Its reviewed locations are never trained on, always join the validation
  # subset, and are reported as their own row (val_subset_gold/..., val_full_gold/...). null: no gold row.
  gold_set: null
  # zslab: validation is slab_count contiguous runs of sections spaced evenly through each volume, together about
  # (1 - train_split) of its examples, with guard_sections sections on each side of every slab used by neither
  # side. Adjacent sections and overlapping crop windows then never cross the split.
  # location: the original random 90/10 over location keys. An existing run keeps the split in its split.json;
  # changing the mode needs -refresh.
  split_mode: zslab
  zslab:
    slab_count: 5
    guard_sections: 1
  split_name: zslab_v1
  # PROJECTED ADJACENT SEEDS NEED BOTH OF THESE SET: registration_root (the volume share, /storage4) AND
  # corrections_root (a directory holding <DB>/<stos group>/ correction sets; the correction set names the stos group
  # and the VikingXML). The trainer compose file (docker/compose.cursor-dev.yaml) bind-mounts the correction service's
  # folder read-only at /corrections (host path SAM2_CORRECTIONS_HOST), so both are set by default. In a container
  # created before that mount existed, or with either value null or pointing at a missing folder, every volume falls
  # back to the centroid placement, the run prints the centroid-fallback warning (and the start-up line
  # "adjacent_poly_seed: projected for [...] / centroid fallback for [...]"), and adjacent seeds are rare.
  # Registration data that carries adjacent-section outlines into the target's mosaic (prompt.adjacent_poly.placement
  # projected; sam2_segmentation_trainer/data/projection.py). Read-only. null or missing: not available, so every
  # volume falls back to the centroid placement with a warning.
  # registration_root: one folder per volume with its VikingXML and stos files, the volume server's Data/Volumes
  #   share (mounted in the trainer container at /storage4 by mount-network-shares.sh): <root>/<VOL>/<VikingXML>.
  # corrections_root: the section-correction service's published residual fields, <root>/<VOL>/<stos group>/
  #   manifest.json + <z>.vfield.npz. The manifest names the stos group and the VikingXML (volume_url), and its
  #   provenance is recorded in training_data.json (adjacent_projection). Bind-mounted read-only from
  #   \\wsl.localhost\Ubuntu\srv\viking\section-correction\corrections (WSL /srv/viking/section-correction/corrections)
  #   to /corrections. A volume with no correction set, or a chained stos group (RC1 grid16), keeps centroid.
  registration_root: /storage4
  corrections_root: /corrections
  # Residual correction on top of the stos: auto applies it to a volume only when it lowers the median distance from
  # each linked neighbour's carried centroid to its target's (checked at load; on set v3 it does for RPC1 and RPC2,
  # not for RC2, whose published field moves points about 180 px away from the links); on / off force it.
  adjacent_residual: auto
  # location mode only. false: 90/10 inside each volume, using every usable sample.
  # true: also cap every volume to the smallest volume's count.
  even_per_volume: false

model:
  checkpoint: null
  config: configs/sam2.1/sam2.1_hiera_l.yaml
  freeze_mode: none
  # Train the prompt encoder's mask_downscaling network (about 4.7K parameters) so it learns the continuous
  # seed / correction / negative mask prompt. Only applies with prompt.enabled. Changing it needs -refresh, not resume.
  unfreeze_mask_cnn: true
  # Off at batch 2: 20% faster per sample than a quarter of the blocks checkpointed, but leaves under 1 GB of the card
  # free beside the segmentation server (see training.batch_size for the Oct 27 2026 measurements). If other GPU work
  # must run alongside training, turn it on with activation_checkpointing_fraction 0.25 (2.7 GB free). Older figures
  # (3 variants, GPU to itself): batch 2 without checkpointing 0.276 s per sample at 14.8 GB; batch 4 with half the
  # blocks checkpointed 0.296 s at 15.6 GB, a quarter thrashed the allocator at 20.5 GB (0.75 s per sample).
  activation_checkpointing: false
  # Share of the 48 Hiera blocks that are checkpointed (spread evenly through the trunk) when activation
  # checkpointing is on. 1.0 = all; 0.25 is the setting measured at batch 2 above.
  activation_checkpointing_fraction: 1.0

# Corrective-click training, as in SAM 2: a share of the batches predict, sample a click from where the
# prediction is wrong, and re-run with the previous low-resolution logits plus the click. Only the last pass
# has gradients. A ground-truth mask is never the prompt, so the model cannot learn to copy its input.
iterative:
  batch_fraction: 0.2   # share of batches that take this path; 0 turns it off
  rounds_min: 2         # corrective clicks per such batch, drawn uniformly from rounds_min..rounds_max
  rounds_max: 6
  prev_mask_prob: 0.5   # per sample, chance the previous logits are fed back (muSAM: always feeding it over-relies)
  # Clicks target goal errors, not trace noise: a positive click in the ground truth's core (val.core_band_px inside
  # its edge) that is not predicted, a negative click in the prediction more than val.core_band_px outside it.

eval:
  # Validation scores the validation split once per prompt, with fixed prompts. Every family reports core recall,
  # leak, merge rate, spill and fragmentation (see val:), with tolerant IoU and boundary F1 at 10 and 20 px as
  # diagnostics:
  #   circle_mask   the inscribed circle as a seed (what production starts from)
  #   correction    a grown, eroded, scaled, warped or simplified true mask; also scored on its input mask, with the change
  #   near_correct  a good human trace (5-12 px wobble plus local excursions up to 30 px): "do no harm", the share
  #                 of samples whose core recall drops at most 0.5 points and whose spill rises at most 0.5%
  #   point         one foreground point at the deepest interior pixel
  #   centroid      one point at the mask centroid (the original prompt; raw IoU, for continuity with earlier runs)
  #   circle_mask_noneg  the circle seed with every negative region and background point removed: how much the model
  #                 leans on neighbors being sent. Never selects a checkpoint. circle_mask is also split into
  #                 with_neg / no_neg (whether the sample's tile has other annotations).
  #   circle_annotator  an annotator-like circle seed: a random centre depth and radius (prompt.circle_seed_jitter's
  #                 ranges; its prob is ignored) instead of the inscribed circle x 0.95, with negatives kept and
  #                 the same with_neg / no_neg split. Production seeds are drawn by annotators, so this is the
  #                 harder, truer circle. Never selects a checkpoint.
  # All families of a sample share one image load and one encoder pass (see val:).
  # Validation runs in fp32 like infer.py and interactive.py; its precision should follow the server's inference precision.
  val_prompts: [circle_mask, correction, near_correct, point, centroid, circle_mask_noneg, circle_annotator]
  # The prompt whose goal metrics pick best_model.pt and drive early stopping (see val:).
  primary_val_prompt: circle_annotator
  grid_every: 10
  max_grids: 40

# Project-goal validation (docs/mask_refinement_plan.md, section 6): identify cells and their connectivity.
val:
  # Each validation loads a sample once, encodes it once and decodes every eval.val_prompts family from that
  # embedding, in batches of batch_size images (batch_size x families prompts per batch). The metrics run in
  # metric_threads threads while the GPU works on the next batch. Each family's prompt is seeded from the run seed,
  # the sample (volume, image key, location id) and the family, so results do not depend on batch composition,
  # family order or which samples are in the pass.
  batch_size: 4
  metric_threads: 4
  # Every epoch validates a fixed subset: this share of each volume, drawn once from the run seed and stratified by
  # volume, always holding every Approved sample, without the legacy centroid family. The best checkpoint and early
  # stopping use it. 1.0 validates the whole split every epoch. 0.10 (about 2,700 samples on validation set v5)
  # measures IoU within ±0.006 and core recall within ±0.004 of the whole split at the 95th percentile, at about
  # 40% of the 0.25 subset's time (2026-10-20 study, see training.early_stopping_*_delta).
  epoch_subset: 0.10
  # The full split, centroid included, runs every this many epochs and after the last (and before an early stop).
  # Its results are logged apart (val_full/*; the subset is val_subset/*), and its subset share is what selects.
  full_every_n_epochs: 3
  # Pixels within this many px of a traced edge are ignored by core recall, leak and spill, and a neighbor's core
  # is the part of it at least this far inside. Traces are about 9 px from the membrane on average.
  core_band_px: 10
  # A merge (the checkpoint-selecting rate) needs the prediction to cover this many px of one neighbor's visible core,
  # as well as 5% of it. A stray blob into a neighbor clipped by the tile edge is not a merge.
  merge_min_px: 500
  # Checkpoint gate. Among epochs whose pooled core recall on the primary prompt is at least this, best_model.pt
  # is the one with the lowest merge rate (spill breaks ties); if none reaches it, the highest core recall.
  core_recall_target: 0.975

hydra:
  job:
    chdir: false
  run:
    dir: .
