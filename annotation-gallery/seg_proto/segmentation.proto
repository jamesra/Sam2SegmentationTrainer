syntax = "proto3";

option csharp_namespace = "Viking.gRPC.SegmentationServiceTypes.V1";

package segmentation;

import "Common/geometry.proto";

// SAM2 segmentation over a fixed 1024 x 1024 tile grid. A tile is a viking.geometry.v1.TileGrid (named once per call)
// and a viking.geometry.v1.GridCell. Tiles are shared between clients: the server keeps each one it has encoded and
// takes it from its own caches before asking a client for it.
service SegmentationService {
  // Upload one tile. A tile already cached keeps its entry, whatever bytes come with the upload, and is not
  // re-encoded (already_cached is true). An upload a SegmentTilesStream is waiting for wakes that stream.
  rpc UploadTile (UploadTileRequest) returns (UploadTileResponse) {}

  // Segment from the prompt in `start`. The client sends `start`, then the mask tiles it announced
  // (SegmentTilesRequest.mask_tile_count), then one TilesAnswer per TilesNeeded. The server takes every tile it needs
  // from its own caches or another stream already fetching it, streams TilesNeeded for the rest, uses each tile as it
  // is uploaded, and streams the finished SegmentationResponse, then ends the call.
  //
  // Statuses: after `result` the call ends OK; a client that cancels gets no result. DEADLINE_EXCEEDED when the
  // announced mask tiles or an answer do not arrive within the server's idle limit (default 60 s). INVALID_ARGUMENT
  // for a malformed conversation or request. RESOURCE_EXHAUSTED over the server's limits (default 64 tiles, 512
  // points, 512 shapes per Feature, 256 mask tiles), naming the limit. FAILED_PRECONDITION for another model_id, and
  // ("NO_MATCHING_MASK ...") when the starting tile yields no mask that fits the prompt. UNAVAILABLE when the GPU is
  // lost.
  rpc SegmentTilesStream (stream SegmentTilesStreamRequest) returns (stream SegmentTilesStreamResponse) {}

  // Which cells SegmentTilesStream would not ask this client for: the server holds them, or reads them from the
  // annotation context's tileset itself. A client calls it before uploading tiles ahead of a request and skips the
  // held ones. A hint only: nothing is pinned, and a cell dropped since is asked for during the request as usual.
  // INVALID_ARGUMENT for an UNSPECIFIED space or more cells than the server's limit (256).
  rpc GetHeldTiles (HeldTilesRequest) returns (HeldTilesResponse) {}

  // Version, load and the served model, for health and selection.
  rpc GetServerStatus (ServerStatusRequest) returns (ServerStatusResponse) {}
}

// ---------------------------------------------------------------------------------------------------------------------
// Tiles

message UploadTileRequest {
  // Was coord (TileCoord), image_data, width and height. The tile size is fixed at 1024 x 1024 and checked on decode.
  reserved 1, 2, 3, 4;
  viking.geometry.v1.TileGrid grid = 5;
  viking.geometry.v1.GridCell cell = 6;
  // The tile image, 1024 x 1024: a greyscale or RGB PNG, Y down.
  bytes image_data = 7;
}

message UploadTileResponse {
  // True when the tile was already cached; the upload's bytes were not used.
  bool already_cached = 1;
}

message HeldTilesRequest {
  viking.geometry.v1.TileGrid grid = 1;
  repeated viking.geometry.v1.GridCell cells = 2;
  // As SegmentTilesRequest.annotation_context_id: lets the server count the cells it reads itself as held.
  int64 annotation_context_id = 3;
}

message HeldTilesResponse {
  // One per requested cell, in request order.
  repeated bool held = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// Prompt

// The prompt: two Features (what the object is, what it is not) and any painted bitmaps as mask tiles. Every
// coordinate is in the grid's space at its downsample: X right, Y up, mosaic or volume pixels / downsample.
//
// The server encodes the prompt for the model it serves, the way that model was trained (ModelInfo.prompt_encoding);
// how is decided by what each part is, not by the client:
// - foreground geometry shapes (a circle, a carried polygon) are softened: the model's trust profile for a shape whose
//   edge is not reliable (for a circle, its radius scaled by the model's circle_diameter_scale);
// - a foreground bitmap is used as drawn;
// - several foreground shapes and the foreground bitmap are one object, combined by the largest encoded value;
// - background shapes and the background bitmap are what the object is not, each trusted by its geometry (a circle by
//   its radius, any other shape by its edge).
// A request needs a foreground click, shape or mask tile (INVALID_ARGUMENT otherwise). Shape.point is refused in a
// prompt: a click goes in Feature.points.
message SegmentTilesRequest {
  // Was tiles (TileCoord), the legacy prompt fields, multimask_output, omit_labeled_image, foreground_boxes,
  // response_content and foreground_mask_tile_count.
  reserved 1, 2, 3, 4, 5, 8, 10, 14;
  reserved "foreground", "background", "foreground_boxes", "multimask_output", "omit_labeled_image",
    "response_content", "foreground_mask_tile_count";
  // The grid every tile of this call is on.
  viking.geometry.v1.TileGrid grid = 16;
  // The cells under the prompt. They need not be uploaded: the server asks for the ones it does not hold.
  repeated viking.geometry.v1.GridCell tiles = 17;
  // Logit above which a pixel is object. Higher values shrink the mask; lower values grow it. Optional so the server
  // can tell an omitted field (it then uses its own default) from an explicit 0.
  optional float mask_threshold = 6;
  // When true, each window is predicted twice: the second pass is given the first pass's logits as SAM2's mask_input
  // along with the same prompt.
  bool use_mask_input = 7;
  // Client-issued ticket, echoed in SegmentationResponse.request_id and written to the server log, so one client log
  // line can be matched to one server result. 0 means not set.
  uint64 request_id = 9;
  // What the object is.
  Feature foreground_feature = 11;
  // What the object is not: the neighbouring annotations. Send the shapes that reach the cells in `tiles`; the server
  // asks for more with TilesNeeded.background_cells as the object grows.
  Feature background_feature = 12;
  // The model the client built the prompt for (ModelInfo.model_id). Another model_id is FAILED_PRECONDITION. Unset is
  // accepted unless the model's manifest says requires_model_id.
  optional string model_id = 13;
  // The Identity annotation context the client has open, 0 when it has none. A server the context is local to reads
  // plain greyscale MOSAIC tiles from the context's tileset itself and does not ask the client for them.
  int64 annotation_context_id = 15;
  // How many MaskTiles follow `start`, foreground and background together: one for every tile a painted bitmap
  // touches, each once. 0 when there is no bitmap. The server waits for all of them before growth starts. More tiles
  // than announced is INVALID_ARGUMENT; a count over the server's limit is RESOURCE_EXHAUSTED.
  uint32 mask_tile_count = 18;
}

// One side of the prompt.
message Feature {
  // Was points (int32 Point), rectangles, mask and mask_role.
  reserved 1, 2, 3, 4;
  reserved "rectangles", "mask", "mask_role";
  // SAM2 clicks.
  repeated viking.geometry.v1.Vector2 points = 5;
  // Annotation shapes of any geometry (circle, ellipse, line, polygon); not points.
  repeated viking.geometry.v1.Shape shapes = 6;
}

// Which side of the prompt a mask tile belongs to.
enum MaskKind {
  MASK_KIND_UNSPECIFIED = 0;
  // Part of the object's painted bitmap.
  MASK_KIND_FOREGROUND = 1;
  // Part of the painted bitmap of what the object is not.
  MASK_KIND_BACKGROUND = 2;
}

// One tile of a painted bitmap, on the call's grid. A bitmap of any size is sent as the tiles it touches. Mask tiles
// belong to one call: they never enter the image cache. At most one bitmap per side.
message MaskTile {
  // Was coord (TileCoord).
  reserved 1;
  viking.geometry.v1.GridCell cell = 6;
  MaskKind kind = 2;
  // True when every pixel of the tile is set; png is then empty.
  bool full = 3;
  // A 1-bit greyscale PNG, Y down like the image tile: 1024 x 1024 when scale is 0 or 1, 256 x 256 when scale is 4
  // (each PNG pixel stands for a 4 x 4 block). A non-zero pixel is set. An empty tile is sent with an empty png and
  // full false. A png of the wrong size is INVALID_ARGUMENT.
  bytes png = 4;
  // Pixels per PNG pixel: 0 or 1 for full resolution, or 4.
  uint32 scale = 5;
}

// Mask tiles of one stream message. A (cell, kind) pair may appear once per call; a duplicate is INVALID_ARGUMENT.
message MaskTiles {
  repeated MaskTile tiles = 1;
}

// ---------------------------------------------------------------------------------------------------------------------
// The conversation

// Client to server.
message SegmentTilesStreamRequest {
  oneof body {
    // The first message, once.
    SegmentTilesRequest start = 1;
    // Reply to a TilesNeeded, one per TilesNeeded, in order.
    TilesAnswer answer = 2;
    // The mask tiles announced by SegmentTilesRequest.mask_tile_count, right after `start`.
    MaskTiles mask_tiles = 3;
  }
}

// Server to client.
message SegmentTilesStreamResponse {
  oneof update {
    // What the server lacks. The client uploads the tiles and sends one TilesAnswer.
    TilesNeeded needed = 1;
    // The finished segmentation. The server ends the call after sending it.
    SegmentationResponse result = 2;
  }
}

message TilesNeeded {
  // Was tiles and masks (TileCoord).
  reserved 1, 2;
  // Tiles to upload with UploadTile. The server uses each one as soon as its upload arrives.
  repeated viking.geometry.v1.GridCell tiles = 3;
  // Cells the object has grown into whose neighbouring annotations the server has not been sent: the client answers
  // with the background shapes that reach them and that it has not sent before.
  repeated viking.geometry.v1.GridCell background_cells = 4;
}

// The client's reply to one TilesNeeded, sent once it has uploaded every tile it can. A tile is settled when its upload
// arrives or it is listed here; the server waits for each tile until one of the two.
message TilesAnswer {
  // Was ready, unavailable and masks_unavailable (TileCoord). Uploads need no listing: the server sees them arrive.
  reserved 1, 2, 3;
  // Tiles the client could not supply (capture failed, off the volume). Growth does not enter them.
  repeated viking.geometry.v1.GridCell unavailable = 4;
  // The background shapes for TilesNeeded.background_cells (none when no neighbour reaches them).
  repeated viking.geometry.v1.Shape background_shapes = 5;
}

// ---------------------------------------------------------------------------------------------------------------------
// Result

message SegmentationResponse {
  // Was labeled_image, width, height, origin_x, origin_y and requested_tiles: each segment's logits carry their own
  // placement.
  reserved 1, 2, 3, 5, 6, 7;
  reserved "labeled_image", "width", "height", "origin_x", "origin_y", "requested_tiles";
  // One per island of the object prompt (one when the prompt does not split), in island order. An island that finds
  // nothing has no result, so island numbers can have gaps.
  repeated SegmentResult segments = 4;
  // SegmentTilesRequest.request_id echoed back. 0 when the request carried none.
  uint64 request_id = 8;
}

// The segmentation of one island: SAM2's logits at their native resolution. The client contours the logits at the
// request's mask_threshold, then places the contour with logits_origin and logits_scale.
message SegmentResult {
  // Was index, mask, x, y, polygons, logits_width, logits_height, logits_x and logits_y.
  reserved 1, 3, 4, 5, 6, 8, 9, 11, 12;
  reserved "index", "mask", "x", "y", "polygons", "logits_width", "logits_height", "logits_x", "logits_y";
  // Which island of the object prompt this is: 1 for the island with the largest trusted area, then decreasing. A
  // prompt that does not split has one island.
  uint32 island = 13;
  // Confidence of this segment (0.0 to 1.0).
  float score = 2;
  // Logits, little-endian float16, row-major: logits_size.width per row, rows from top (largest Y) to bottom.
  // Samples nobody predicted hold a large negative value.
  bytes logits = 7;
  viking.geometry.v1.IntSize logits_size = 15;
  // The top-left pixel of sample (0, 0): a grid-space pixel index (X right, Y up, at the grid's downsample; pixel
  // (x, y) covers [x, x + 1) x [y, y + 1)). Sample (i, j), column i and row j, covers pixel columns
  // origin.x + i * scale .. origin.x + (i + 1) * scale - 1 and pixel rows origin.y - (j + 1) * scale + 1 ..
  // origin.y - j * scale. Its centre is (origin.x + (i + 0.5) * scale, origin.y + 1 - (j + 0.5) * scale).
  viking.geometry.v1.IntPoint logits_origin = 14;
  // Pixels per logit sample on both axes (4 for a SAM2 window).
  float logits_scale = 10;
}

// ---------------------------------------------------------------------------------------------------------------------
// Status

message ServerStatusRequest {}

message ServerStatusResponse {
  // Was capabilities (submission and resolution mode) and mask_tiles: every model is a single-resolution tile grid.
  reserved 9, 13;
  reserved "capabilities", "mask_tiles";
  string version = 1;
  double uptime_seconds = 2;
  string message = 3;
  // Concurrent UploadTile and SegmentTilesStream calls in flight.
  uint32 in_flight_requests = 4;
  uint32 cached_images = 5;
  uint64 cache_memory_bytes = 6;
  // Exponential moving average of call duration.
  double recent_latency_ms = 7;
  uint32 inference_workers = 8;
  // Which image encoder new embeddings are made with: "eager" or "compiled". Empty when the model does not report it.
  string encoder_generation = 10;
  // State of the background encoder compile: "off", "warming", "ready" or "failed".
  string compile_status = 11;
  // The served model, from its manifest. Always set; a model with no manifest reports model_id "unknown".
  ModelInfo model = 12;
}

// The identity and feeding contract of the served model, from the model's manifest, which travels with the weights.
message ModelInfo {
  // The model's version number, v<VERSION>, such as "v5". Send it back in requests as model_id.
  string model_id = 1;
  // One export of that model, v<VERSION>.<EPOCH>, such as "v5.4".
  string model_version = 2;
  string display_name = 3;
  // The prompt encoding the server builds SAM2's mask_input with, such as "edge-confidence-v6" or
  // "edge-confidence-v7". The client never encodes: this is for display and logs.
  string prompt_encoding = 4;
  // The training data the model saw: the data folder (such as "v3") and a short fingerprint. "unknown" when not
  // recorded.
  string training_data_set = 5;
  string training_data_fingerprint = 6;
  // The manifest's client_contract object verbatim, as JSON (requires_model_id, ...). circle_diameter_scale is
  // applied by the server and is informational here.
  string contract_json = 7;
  // What the operator wrote about this model in its manifest. May be empty.
  string description = 8;
}
