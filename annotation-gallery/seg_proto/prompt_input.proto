syntax = "proto3";

option csharp_namespace = "Viking.gRPC.SegmentationServiceTypes.V1";

package segmentation;

import "Common/geometry.proto";

// The input of the shared prompt library (Viking SegmentationPrompts): everything a client knows about the
// annotations it wants segmented. The library turns it into a SegmentTilesRequest with one set of rules, so the Viking
// client and the annotation gallery send byte-identical requests for the same location (and share the server's result
// cache), and those requests match how the served model was trained. Not sent to the server.
//
// Every coordinate is in the section's MOSAIC space at full resolution (downsample 1), X right, Y up, as the location
// stores it.
message PromptInput {
  // Volume, section and tileset of the request. The library fills channel and transform from `tileset`, the space
  // (MOSAIC) and the downsample (1).
  string volume = 1;
  int32 section = 2;
  // The VikingXML tileset of the section the tiles come from (Tileset@name), which is also what the server reads
  // tiles from by itself.
  string tileset = 3;
  // The location(s) to segment: one, or the locations of a merged group. Together they are one prompt.
  repeated PromptAnnotation targets = 4;
  // Annotations on the section near the targets that may be neighbours. The library keeps those its rule accepts; the
  // caller passes what it has, at least every annotation whose bounds meet PromptBounds.reach.
  repeated PromptAnnotation candidates = 5;
  // Structures for the descendant walk: every structure of a target, and each one's ancestors; with them, every
  // structure of a candidate.
  repeated PromptStructure structures = 6;
  // SegmentTilesRequest.mask_threshold; unset leaves it unset.
  optional float mask_threshold = 7;
  // SegmentTilesRequest.model_id; empty or "unknown" leaves it unset.
  string model_id = 8;
  // SegmentTilesRequest.annotation_context_id.
  int64 annotation_context_id = 9;
  // SegmentTilesRequest.request_id.
  uint64 request_id = 10;
  // SegmentTilesRequest.refresh.
  bool refresh = 11;
  // SegmentTilesRequest.job_id; 0 leaves it unset.
  int64 job_id = 12;
}

// One location as the annotation database holds it.
message PromptAnnotation {
  int64 id = 1;
  // Location.TypeCode: 1 circle, 4 polygon, 6 curve polygon, 7 closed curve; others are ignored.
  int32 type_code = 2;
  // Location.MosaicShape as WKT. Not used for a circle, whose geometry is its X, Y and Radius.
  string mosaic_wkt = 3;
  // Location.X, Location.Y (mosaic): a circle's centre.
  double x = 4;
  double y = 5;
  // Location.Radius (mosaic, the TRUE radius).
  double radius = 6;
  // Location.ParentID: the structure the location belongs to.
  int64 structure_id = 7;
  // Location.LastModified, UTC, in .NET ticks (LocationRef.last_modified_ticks).
  int64 last_modified_ticks = 8;
}

// One structure, for the descendant walk and the cell rule.
message PromptStructure {
  int64 id = 1;
  // Structure.ParentID; 0 for none.
  int64 parent_id = 2;
  // Structure.TypeID.
  int64 type_id = 3;
  // The structure type's ParentID; 0 for none.
  int64 type_parent_id = 4;
}

// What PromptBounds answers: where the caller must look for candidates.
message PromptReach {
  // Every candidate whose bounds meet this rectangle (mosaic pixels) may be a neighbour.
  viking.geometry.v1.Rectangle reach = 1;
}

// The background for cells the server asked about (TilesNeeded.background_cells).
message PromptBackground {
  // Shapes for TilesAnswer.background_shapes, in location id order, each annotation once per call.
  repeated viking.geometry.v1.Shape shapes = 1;
  // The location ids of those shapes, the caller's record of what the call has sent.
  repeated int64 sent_ids = 2;
}
